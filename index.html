<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#17202e;--mu:#667085;--bd:#e3e7ee;--pr:#1f3a5f}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--card:#1a212c;--tx:#eef1f6;--mu:#9aa5b6;--bd:#2b3544;--pr:#6c9ad6}}
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px)}
header{position:sticky;top:0;background:var(--bg);padding:10px 12px 6px;z-index:5;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}h1{font-size:19px;margin:0;flex:1}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:var(--pr);color:#fff}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs .on{background:var(--pr);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chips button{white-space:nowrap;padding:6px 11px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px}.chips .on{background:var(--pr);color:#fff}
main{padding:8px 12px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 2px 6px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.n{font-weight:600;font-size:16px}.s{color:var(--mu);font-size:13px;margin-top:2px}
.b{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);margin:4px 4px 0 0}.v{background:#fde2c8;color:#7a3b00}
.a{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.a a,.a button{flex:1 1 28%;text-align:center;text-decoration:none;color:#fff;padding:10px 0;border-radius:10px;font-size:14px;border:0}
.call{background:#2e7d32}.wa{background:#1fa855}.mp{background:#1565c0}.wz{background:#05a5d1}.ed{background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;flex:.6!important}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);width:56px;height:56px;border-radius:28px;font-size:28px;padding:0;box-shadow:0 4px 12px #0004}
dialog{border:0;border-radius:16px;width:92%;max-width:420px;background:var(--bg);color:var(--tx);padding:16px}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.ck{flex:1 1 40%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 0;font-size:14px}.ck.on{background:#2e7d32;color:#fff;border-color:#2e7d32}.c.dn{border-color:#2e7d32;background:color-mix(in srgb,#2e7d32 12%,var(--card))}#cnt{font-size:13px;color:var(--mu);display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.a a,.a button,.g,.fab,.ck{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.a a.call,.a a.wa,.a a.mp,.a a.wz{background:color-mix(in srgb,var(--c) 12%,var(--card));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.call{--c:#2e7d32}.wa{--c:#1a8f4f}.mp{--c:#1565c0}.wz{--c:#0891b2}
@media(prefers-color-scheme:dark){.call{--c:#66bb6a}.wa{--c:#4cd98a}.mp{--c:#64a8f0}.wz{--c:#4fc3dc}}
.fab{border-radius:28px}</style></head><body>
<header><div class="row"><h1>Delivery Manager</h1><button class="g" onclick="doSync()" id="sy"></button><button class="g" onclick="openBc()" id="bb"></button><button class="g" onclick="openSet()" id="gb" aria-label="Settings"></button></div>
<div class="tabs" id="tabs"></div><input id="q" placeholder="Search name, phone, zone…" oninput="draw()">
<div class="chips" id="zc"></div><div class="chips" id="mc"></div><div id="cnt"></div></header>
<main id="list"></main>
<button class="fab" onclick="edit(-1)" id="fab" aria-label="Add"></button>
<dialog id="dl"><form method="dialog" onsubmit="return false"><div id="fm"></div><div class="row" style="margin-top:14px"><button class="g" onclick="dl.close()">Cancel</button><button style="background:#c62828;display:none" id="del" onclick="remove()">Delete</button><button onclick="save()">Save</button></div></form></dialog>
<dialog id="ds"><div class="s">Google Apps Script web app URL (for sheet sync). Leave empty to work offline.</div><input id="url" placeholder="https://script.google.com/macros/s/…/exec"><button class="g" style="margin-top:12px;width:100%" onclick="restore()">Restore original list</button><div class="row" style="margin-top:14px"><button class="g" onclick="ds.close()">Close</button><button onclick="setUrl()">Save</button></div></dialog>
<dialog id="dbc" style="max-height:88vh;overflow:auto"><b>Broadcast Message</b>
<label>Message (use {name} to insert each customer’s name)</label><textarea id="bm" rows="4" placeholder="Hi {name}, your meal is on its way." oninput="bc()"></textarea>
<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="skipv" checked onchange="bc()" style="width:auto"> Skip customers on vacation</label>
<div class="s" id="bt" style="margin:8px 0"></div><div id="bl"></div>
<div class="row" style="margin-top:10px"><button onclick="dbc.close()">Close</button></div></dialog>
<script>

25, "Mohammad", "+35699681458", "Lunch", "Burmarrad", "", "", "Group", "Active"], [26, "Sabastin", "+35699079769", "Lunch", "Burmarrad", "", "", "1 lunch", "Vacation"], [28, "Saied", "+35679361699", "Lunch / Dinner", "Bugibba", "", "", "", "Vacation"], [29, "Antony", "+35699972081", "Lunch", "Bugibba", "", "", "", "Active"], [30, "Shamon", "+35677418248", "Lunch / Dinner", "Bugibba", "", "", "Chapathi", "Active"], [31, "Elezbath", "+35699028709", "Lunch", "Bugibba", "", "", "", "Active"], [32, "Biju Raj", "+35699967399", "Lunch / Dinner", "Bugibba", "", "", "", "Active"], [33, "Ebin", "+35679397001", "Lunch / Dinner", "Bugibba", "", "", "", "Active"], [35, "Amal", "+35699404220", "Lunch", "Bugibba", "", "", "2 lunch", "Active"], [36, "Sandeep", "+35699763980", "Lunch / Dinner", "Bugibba", "", "", "", "Active"], [27, "Fayiz", "+35677120254", "Lunch", "Different location", "", "", "", "Active"], [34, "Renju", "+35699753153", "Lunch / Dinner", "Different location", "", "", "", "Active"], [37, "Albin", "+35699359486", "Lunch / Dinner", "Different location", "Attard", "", "", "Active"], [12, "Abhinav", "+35699559755", "Lunch", "Zone not set", "", "", "", "Active"], [22, "Midhu", "+35699035958", "Lunch", "Zone not set", "", "", "", "Active"], [23, "Anns", "+35699725855", "Lunch", "Zone not set", "", "", "", "Active"]], "Riders": [], "Leave": [["Delip", ""], ["Fabin", ""], ["Vinayan", ""], ["Basil", ""], ["Vishnu", ""], ["Thagaselavam", ""], ["Yuvaraj", ""], ["Some bus driver", ""], ["Dj", ""], ["Pratheep Bugibba", ""]]}, ZONES=["Mosta","Pavi","Attard","Rabat","Mgarr","Burmarrad","Bugibba","Different location","Zone not set"];
let DB=JSON.parse(localStorage.getItem("dbv1")||"null")||JSON.parse(JSON.stringify(SEED));

const TODAY=new Date().toLocaleDateString("en-CA");Object.keys(localStorage).forEach(k=>{if(k.startsWith("done_")&&k!="done_"+TODAY)localStorage.removeItem(k)});let DONE=JSON.parse(localStorage.getItem("done_"+TODAY)||"{}");
const dk=(r,s)=>r[0]+"-"+r[1]+"-"+s,slots=r=>{const m=String(r[3]),o=[];if(/Lunch/.test(m))o.push("Lunch");if(/Dinner/.test(m))o.push("Dinner");return o};

const IC={call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',wa:'<path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',nav:'<path d="M3 11l18-8-8 18-2-8z"/>',edit:'<path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 7l4 4"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',circ:'<circle cx="12" cy="12" r="8"/>',sync:'<path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',mega:'<path d="M4 10v4h3l7 4V6L7 10z"/><path d="M18 9a4 4 0 0 1 0 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',reset:'<path d="M4 12a8 8 0 1 0 3-6.2L4 8"/><path d="M4 3v5h5"/>'};
